<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- No favicon: empty data URI stops browsers from requesting /favicon.ico -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PREENCHER: seu nome e uma descrição curta -->
    <meta name="description" content="Portfólio acadêmico de Eric Lourenço — Desenvolvimento de Software Multiplataforma, FATEC São José dos Campos." />
    <title>Portfólio · Eric Lourenço</title>
    <script>
      // Applies the saved/system theme before first paint to avoid a flash
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
